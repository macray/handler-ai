[project]
name = "handler-control-plane"
version = "0.1.0"
license = "Apache-2.0"
description = "Control plane daemon: agents, projects, composition, runs, ACP relay + policy, Control API"
requires-python = ">=3.12"
dependencies = [
    "handler-contracts",
    "handler-harness-adapters",
    "fastapi>=0.141",
    "uvicorn>=0.53",
    "websockets>=17",
    "tomlkit>=0.13",
    "cryptography>=45",
    "httpx>=0.28",
    "jsonschema>=4.23",
    "pyyaml>=6",
    "dulwich>=1.2",
]

[project.scripts]
handlerd = "handler_control.daemon:main"

[tool.uv.sources]
handler-contracts = { workspace = true }
handler-harness-adapters = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/handler_control"]
