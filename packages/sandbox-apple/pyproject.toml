[project]
name = "handler-sandbox-apple"
version = "0.1.0"
license = "Apache-2.0"
description = "Contract A (sandbox) implementation on Apple container (experimental)"
requires-python = ">=3.12"
dependencies = ["handler-contracts", "handler-sandbox-kit"]

[project.scripts]
handler-sandbox-apple = "handler_sandbox_apple.cli:main"

[tool.uv.sources]
handler-contracts = { workspace = true }
handler-sandbox-kit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/handler_sandbox_apple"]
