[project]
name = "handler-contracts"
version = "0.1.0"
license = "Apache-2.0"
description = "Reference implementation of the Handler contracts"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.13,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/handler_contracts"]
