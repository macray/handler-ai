[project]
name = "handler-sandbox-podman"
version = "0.1.0"
license = "Apache-2.0"
description = "Contract A (sandbox) implementation on rootless podman"
requires-python = ">=3.12"
dependencies = ["handler-contracts"]

[project.scripts]
handler-sandbox-podman = "handler_sandbox_podman.cli:main"

[tool.uv.sources]
handler-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/handler_sandbox_podman"]
