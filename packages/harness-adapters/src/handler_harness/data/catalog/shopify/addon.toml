# Shopify CLI addon (contract G.1, handler.addon/v1): themes and apps of one Shopify store.
# A binding (~/.config/handler-ai/bindings/<name>.toml) says which store and which token; see
# PROVISIONING.md for the account to create first.
apiVersion = "handler.addon/v1"
name = "shopify"
description = "Shopify CLI: work on the themes (and apps) of one store"
image = "localhost/handler-ai-addon-shopify"  # no tag: agents mount :latest (G.4)
commands = ["shopify"]
# Run by a rebuild's check, without network: `shopify version` would fail there (it looks up the
# latest release and exits 1 offline); this loads the CLI and its theme commands.
check = ["shopify", "theme", "list", "--help"]

# Hosts the CLI calls (seen in log-only mode, 2026-09-25): theme commands with a Theme Access
# token go through Shopify's Theme Access proxy (theme-kit-access.shopifyapps.com); cdn.shopify.com
# serves assets; registry.npmjs.org is the CLI's update check (without it, commands print a stack
# trace and `shopify version` fails). The store itself (*.myshopify.com) serves `theme dev` previews.
egress = [
    "theme-kit-access.shopifyapps.com:443",
    "*.shopify.com:443",
    "*.shopifycdn.com:443",
    "*.myshopify.com:443",
    "registry.npmjs.org:443",
]

[env]
SHOPIFY_CLI_NO_ANALYTICS = "1"

[settings.store]
env = "SHOPIFY_FLAG_STORE"   # read by every `shopify theme` command as --store
required = true
description = "the store's myshopify domain, e.g. my-dev-shop.myshopify.com"

[secretSlots.theme_token]
env = "SHOPIFY_CLI_THEME_TOKEN"   # a Theme Access password: theme commands without a login
description = "Theme Access password (shptka_…) of the agent's account on the store"

[secretSlots.partners_token]
env = "SHOPIFY_CLI_PARTNERS_TOKEN"   # only for `shopify app …`
description = "Partners CLI token, for app commands"
