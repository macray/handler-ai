# Playwright MCP addon (contract G.1, handler.addon/v1): a web browser for the agent, as an MCP server
# (docs/dev/design/browser.md). Headless, or a window the person watches when the agent has a
# display (contract A.6). A binding needs no setting: `addon = "playwright"` is enough; see
# PROVISIONING.md for logins.
apiVersion = "handler.addon/v1"
name = "playwright"
description = "Web browser (Playwright MCP): headless, or a window you watch"
image = "localhost/handler-ai-addon-playwright"  # no tag: agents mount :latest (G.4)
commands = ["playwright-mcp", "playwright-mcp-check"]
# Offline: launches the toolbox's Chromium headless through the installed Playwright.
check = ["playwright-mcp-check"]
# No egress of its own: the browser goes where the task needs, through the sandbox's proxy, so the
# agent's allow-list decides (log-only mode shows which hosts a site needs). A local preview
# on the sandbox's 127.0.0.1 (e.g. `shopify theme dev`) needs none.

[mcp]
command = ["playwright-mcp"]

[settings.headless]
env = "HANDLER_PLAYWRIGHT_HEADLESS"
description = "\"1\": stay headless even when the agent has a display"

[secretSlots.storage_state]
env = "HANDLER_PLAYWRIGHT_STORAGE_STATE"
description = "Playwright storage state (cookies, local storage) of a dedicated account, as one line of JSON"
