# A mini app (contract H, handler.miniapp/v1). Change `name` (a-z, 0-9, '-': it becomes the app's
# address, http://<name>.localhost:7430/) and `description`; raise `version` before each deploy.
apiVersion = "handler.miniapp/v1"
name = "notes"
version = "0.1.0"
description = "Short notes"

# [server]
# entry = "server/main.ts"     # default; its directory is installed whole
# [ui]
# dir = "ui/dist"              # default; built by `deno task build` in ui/
# [needs]
# egress = ["api.example.com:443"]   # hosts the backend may reach; none by default
# [resources]
# memory = "512m"
