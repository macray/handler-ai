# Mini apps addon (contract G.1, handler.addon/v1): what an agent needs to write a mini app (contract
# H, docs/dev/design/miniapps.md): Deno (the only runtime of mini apps, the version they run on),
# the skill and its template (Svelte UI, Deno + SQLite backend). A binding needs no setting:
# `addon = "miniapp"` is enough.
apiVersion = "handler.addon/v1"
name = "miniapp"
description = "Write mini apps: Deno, and a skill with a Svelte + SQLite template"
image = "localhost/handler-ai-addon-miniapp"  # no tag: agents mount :latest (G.4)
commands = ["deno"]
check = ["deno", "--version"]
# npm packages (the UI's build: vite, svelte) and jsr packages; npm tarballs come from the registry
# host too. Nothing else: an app's backend runs without network unless its manifest says so.
egress = ["registry.npmjs.org:443", "jsr.io:443"]

[env]
DENO_NO_UPDATE_CHECK = "1"
