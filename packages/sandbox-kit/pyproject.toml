[project]
name = "handler-sandbox-kit"
version = "0.1.0"
license = "Apache-2.0"
description = "Contract A parts shared by every sandbox runtime: the launch, the network filter"
requires-python = ">=3.12"
dependencies = ["handler-contracts"]

[tool.uv.sources]
handler-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/handler_sandbox_kit"]
