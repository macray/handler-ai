[project]
name = "handler-smd"
version = "0.1.0"
license = "Apache-2.0"
description = "Structured markdown: markdown humans write, agents and apps parse, validate and edit"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.13,<3", "markdown-it-py>=4", "pyyaml>=6"]

[project.scripts]
handler-smd = "handler_smd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/handler_smd"]
