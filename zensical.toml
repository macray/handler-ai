# The documentation website, built by scripts/build-docs-site.py from README.md and docs/
# (gathered in docs-site/src, built into docs-site/site, both ignored), published on GitHub Pages
# by .github/workflows/docs.yml.
[project]
site_name = "Handler"
site_description = "Run AI agent harnesses in rootless sandboxes on your own machine."
# the public repository: its Pages site, and where links to code point
site_url = "https://macray.github.io/handler-ai/"
repo_url = "https://github.com/macray/handler-ai"
docs_dir = "docs-site/src"
site_dir = "docs-site/site"
nav = [
  { "Home" = "index.md" },
  { "Using Handler" = [
    "docs/getting-started.md",
    "docs/windows.md",
    "docs/concepts.md",
    "docs/configuration.md",
    "docs/security.md",
    "docs/known-limitations.md",
  ] },
  { "Features" = [
    "docs/tools.md",
    "docs/browser.md",
    "docs/notes.md",
    "docs/automations.md",
    "docs/plans.md",
    "docs/apps.md",
    "docs/sources.md",
    "docs/ask.md",
    "docs/phone.md",
  ] },
  { "Command line" = [
    "docs/cli/index.md",
    { "Working with an agent" = ["docs/cli/run.md", "docs/cli/attach.md", "docs/cli/terminal.md", "docs/cli/acp.md", "docs/cli/agent-options.md"] },
    { "What runs" = ["docs/cli/session.md", "docs/cli/agent.md", "docs/cli/project.md", "docs/cli/plan.md"] },
    { "Model access" = ["docs/cli/account.md", "docs/cli/provider.md", "docs/cli/secret.md"] },
    { "What an agent can get" = ["docs/cli/tool.md", "docs/cli/connection.md", "docs/cli/notes.md", "docs/cli/source.md"] },
    { "Images, apps, automations" = ["docs/cli/image.md", "docs/cli/toolbox.md", "docs/cli/runtime.md", "docs/cli/app.md", "docs/cli/automation.md", "docs/cli/inbox.md", "docs/cli/ask.md"] },
    { "Handler itself" = ["docs/cli/setup.md", "docs/cli/daemon.md", "docs/cli/ui.md"] },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "white"
accent = "deep orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "deep orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.highlight = {}
pymdownx.inlinehilite = {}
