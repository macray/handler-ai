# The documentation website, built by scripts/build-docs-site.py from README.md and docs/
# (gathered in docs-site/src, built into docs-site/site, both ignored), published on GitHub Pages
# by .github/workflows/docs.yml.
[project]
site_name = "Handler"
site_description = "Run AI agent harnesses in rootless sandboxes on your own machine."
# the public repository: its Pages site, and where links to code point
site_url = "https://macray.github.io/handler-ai/"
repo_url = "https://github.com/macray/handler-ai"
docs_dir = "docs-site/src"
site_dir = "docs-site/site"
nav = [
  { "Home" = "index.md" },
  { "Using Handler" = [
    "docs/user/getting-started.md",
    "docs/user/concepts.md",
    "docs/user/configuration.md",
    "docs/user/security.md",
    "docs/user/known-limitations.md",
  ] },
  { "Features" = [
    "docs/user/addons.md",
    "docs/user/browser.md",
    "docs/user/knowledge.md",
    "docs/user/automations.md",
    "docs/user/mini-apps.md",
    "docs/user/phone.md",
  ] },
  { "Command line" = [
    "docs/user/cli/index.md",
    { "Working with an agent" = ["docs/user/cli/run.md", "docs/user/cli/attach.md", "docs/user/cli/terminal.md", "docs/user/cli/acp.md", "docs/user/cli/agent-options.md"] },
    { "What runs" = ["docs/user/cli/session.md", "docs/user/cli/agent.md", "docs/user/cli/project.md"] },
    { "Model access" = ["docs/user/cli/account.md", "docs/user/cli/provider.md", "docs/user/cli/secret.md"] },
    { "What an agent can get" = ["docs/user/cli/addon.md", "docs/user/cli/binding.md", "docs/user/cli/knowledge.md"] },
    { "Images, apps, automations" = ["docs/user/cli/image.md", "docs/user/cli/app.md", "docs/user/cli/automation.md", "docs/user/cli/inbox.md"] },
    { "Handler itself" = ["docs/user/cli/setup.md", "docs/user/cli/daemon.md", "docs/user/cli/ui.md"] },
  ] },
  { "Development" = [
    "docs/dev/development.md",
    "docs/dev/architecture.md",
    "docs/dev/model.md",
    "docs/dev/code-map.md",
    "docs/dev/contracts.md",
    "docs/dev/ui-ux.md",
    { "Design" = [
      "docs/dev/design/index.md",
      "docs/dev/design/configuration.md",
      "docs/dev/design/addons.md",
      "docs/dev/design/browser.md",
      "docs/dev/design/knowledge.md",
      "docs/dev/design/miniapps.md",
      "docs/dev/design/remote.md",
      "docs/dev/design/services.md",
    ] },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "white"
accent = "deep orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "deep orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.highlight = {}
pymdownx.inlinehilite = {}
