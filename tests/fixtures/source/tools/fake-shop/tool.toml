# An addon reaching a service (G.1): its egress, a required setting, two secrets. Its image is
# never built: the test daemon makes its folder, empty (G.4).
apiVersion = "handler.tool/v1"
name = "fake-shop"
description = "A shop's command line, for the tests"
image = "localhost/handler-ai-tool-fake-shop"
commands = ["fake-shop"]
egress = ["*.shop.example.com:443"]

[settings.store]
env = "FAKE_SHOP_STORE"
required = true
description = "the store's domain, e.g. dev.shop.example.com"

[secretSlots.theme_token]
env = "FAKE_SHOP_THEME_TOKEN"
description = "the store's theme token"

[secretSlots.partners_token]
env = "FAKE_SHOP_PARTNERS_TOKEN"
description = "a partner token, for app commands"
