[project]
name = "handler-gateway"
version = "0.1.0"
license = "Apache-2.0"
description = "Remote-control gateway for handler: a mailbox relaying end-to-end encrypted envelopes"
requires-python = ">=3.12"
dependencies = ["starlette>=0.48", "uvicorn>=0.35"]

[project.scripts]
handler-gateway = "handler_gateway.cli:main"

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.16", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/handler_gateway"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL"]
ignore = ["PLR2004", "PLR0911", "PLR0913", "PLR0915"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore:Using `httpx`"]
markers = [
    "rule(*names): the rules of Handler's map this test proves, by name",
]
