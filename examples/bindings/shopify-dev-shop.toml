# A binding (contract G.2, handler.binding/v1; an addon configuration in the web UI): the shopify
# addon on one store, with its token.
# Copy to ~/.config/handler-ai/bindings/shopify-dev-shop.toml and adjust; give it to an
# agent (web UI: Addons in the agent's form, or `handler run … --binding shopify-dev-shop`).
# How to create the store and the token: addons/shopify/PROVISIONING.md.
apiVersion = "handler.binding/v1"
addon = "shopify"
description = "Development store, Theme Access token"
settings = { store = "my-dev-shop.myshopify.com" }
secrets = { theme_token = { command = ["pass", "show", "shopify/dev-theme-token"] } }
