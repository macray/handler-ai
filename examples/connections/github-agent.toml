# A connection (contract G.2, handler.connection/v1): the github tool as the account of one token
# (a fine-grained token of an account made for the agent: tools/github/PROVISIONING.md of its
# source). Copy to ~/.config/handler-ai/connections/github-agent.toml and adjust; give it to an
# agent (web UI: Tools in the agent's form, or `handler run … --tool github=github-agent`).
apiVersion = "handler.connection/v1"
tool = "github"
description = "GitHub, as the agent's own account"
secrets = { token = { command = ["pass", "show", "github/agent-token"] } }
